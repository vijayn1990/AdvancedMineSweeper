<html>
<body>
        <select onselect="fetchCount()" id="levelSelector">
            <option value="10" label="10">10</option>
            <option value="20" label="20"> 20</option>
            <option value="30" label="30">30</option>
        </select>
        <button type="submit" onclick="fetchCount()">Fetch the Mine</button>
<p id="selectedCount"></p>
    </body>
</html>


<script type="text/javascript">
    function fetchCount()
    {
        const selectedValue=document.getElementById("levelSelector").value;
       document.getElementById("selectedCount").value= selectedValue;
    }

</script>
